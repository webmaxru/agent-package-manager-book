name: Publish content release

# Cuts a versioned GitHub Release for a **content edition** of the book.
#
# The book content is versioned independently of the site tooling (see
# content/version.yml + content/CHANGELOG.md). Pushing a `vX.Y` tag builds the
# site and a release-only PDF from that content, then publishes a GitHub Release
# whose notes come straight from the changelog, with a per-edition PDF attached
# (apm-book-vX.Y.pdf). Re-running for an existing tag updates it in place.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing merged edition tag with release metadata/tooling, e.g. v1.2"
        required: true

# Needed to create/update Releases and upload the PDF asset.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the requested tag
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release input must be an existing vX.Y tag, not a branch or expression."
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout (full history for changelog + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      - name: Require release tooling at the tag
        run: |
          if [[ ! -f content/version.yml || ! -f site/validate_release.py ]]; then
            echo "::error::This tag predates release metadata/tooling. Preserve its historical assets; publish corrections as a new edition."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml playwright

      - name: Validate edition, changelog, content delta, and merged tag
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: python site/validate_release.py --tag "$RELEASE_TAG"

      - name: Build the site from content/toc.yml
        run: python site/generate.py
        env:
          # Public, write-only Application Insights client key (repo variable). If
          # unset the cookieless beacon is a safe no-op.
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}

      - name: Install Chromium for release PDF rendering
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build release-only PDF
        run: python site/generate_pdf.py

      - name: Name the PDF for this edition
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: cp site/apm-book.pdf "apm-book-$RELEASE_TAG.pdf"

      - name: Build release notes from the changelog
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: python site/extract_release_notes.py "$RELEASE_VERSION" > RELEASE_NOTES.md

      - name: Publish or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          EXISTING_TAGS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq -- "$RELEASE_TAG" <<< "$EXISTING_TAGS"; then
            gh release edit "$RELEASE_TAG" --title "Book $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Book $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" "apm-book-$RELEASE_TAG.pdf" --clobber
