name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Published edition tag (vX.Y) or its full commit SHA; older editions roll back"
        required: true

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  published-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Require released content using the trusted allowlist
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            test -n "$REF"
            python scripts/book_release.py deploy-plan --ref "$REF"
          else
            python scripts/book_release.py deploy-plan --sha "$SHA"
          fi

  build:
    needs: published-source
    if: github.ref == 'refs/heads/main' && needs.published-source.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout trusted release validators
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout verified published source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.published-source.outputs.sha }}
          path: book
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Validate content edition before deployment
        run: python trusted/site/validate_release.py --root book
      - name: Generate site from content/toc.yml
        working-directory: book
        run: python site/generate.py
        env:
          # Public write-only client key; an unset variable disables telemetry.
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/site

  deploy:
    needs: [published-source, build]
    if: github.ref == 'refs/heads/main' && needs.published-source.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the released edition
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          TAG: ${{ needs.published-source.outputs.tag }}
        run: python scripts/check_site.py --url "$SITE_URL" --tag "$TAG"
