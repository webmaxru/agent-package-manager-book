name: Deploy book to GitHub Pages

# Builds the static APM book from content/toc.yml + content/chapters/ fragments
# via site/generate.py.
# then publishes site/ to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions required by the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate content edition before deployment
        env:
          BASE_REF: ${{ github.event.before }}
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            python site/validate_release.py --base-ref "$BASE_REF"
          else
            python site/validate_release.py
          fi

      - name: Generate site from content/toc.yml
        run: python site/generate.py
        env:
          # Public, write-only Application Insights client key — injected at build
          # time as a repo *variable* (not a secret). Set with:
          #   gh variable set APPINSIGHTS_CONNECTION_STRING --body "InstrumentationKey=...".
          # If unset, the cookieless beacon is a safe no-op (no telemetry).
          APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
