name: Book CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_preview:
        description: "Upload a PDF preview (expires after one day)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: book-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted release validators
        uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install metadata dependency
        run: python -m pip install pyyaml

      - name: Run workflow tooling tests
        run: python -m unittest discover -s tests -v

      - name: Validate proposed edition and content delta
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            python trusted/site/validate_release.py --root . --base-ref "$BASE_REF"
          else
            python trusted/site/validate_release.py --root .
          fi

      - name: Validate editorial evidence for changed content
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(python -c 'import sys; sys.path.insert(0, "trusted/site"); from validate_release import changed_content; from pathlib import Path; print("yes" if changed_content(Path("."), sys.argv[1]) else "no")' "$BASE_REF")"
          if [[ "$changed" == yes ]]; then
            python trusted/site/validate_evidence.py --root . --base-ref "$BASE_REF"
            python trusted/site/release_candidate.py --root .
          fi

      - name: Check launcher entry points without starting agents
        shell: pwsh
        run: |
          .\scripts\run-fleet.ps1 -DryRun
          .\scripts\run-fleet.ps1 -UpdateBook -CheckOnly -DryRun

      - name: Build generated HTML without publishing
        if: runner.os == 'Linux'
        run: python site/generate.py

      - name: Install release PDF toolchain
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Build and verify PDF
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python site/generate_pdf.py
          test -s site/apm-book.pdf
          head -c 5 site/apm-book.pdf | grep -Fx '%PDF-'

      - name: Identify requested preview
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.upload_preview
        id: preview
        shell: bash
        run: python scripts/artifact_storage.py preview-name >> "$GITHUB_OUTPUT"

      - name: Upload PDF preview
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.upload_preview
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.preview.outputs.name }}
          path: site/apm-book.pdf
          if-no-files-found: error
          retention-days: 1

  book-release-preflight:
    name: Book release preflight
    if: always()
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platform checks
        env:
          RESULT: ${{ needs.preflight.result }}
        run: test "$RESULT" = success
