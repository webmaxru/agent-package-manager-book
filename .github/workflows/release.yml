name: Release book

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Approved merged content PR number"
        required: false
      head_sha:
        description: "Approved PR head"
        required: false
      base_sha:
        description: "Preflight base"
        required: false
      merge_sha:
        description: "Exact resulting merge commit"
        required: false
      tag:
        description: "Existing vX.Y tag for safe recovery"
        required: false

permissions: {}
concurrency:
  group: book-publish
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.merge_sha }}
      base: ${{ steps.gate.outputs.base }}
      recovery: ${{ steps.gate.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - id: gate
        name: Validate approved merge provenance or existing published tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head_sha }}
          BASE: ${{ inputs.base_sha }}
          MERGE: ${{ inputs.merge_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          args=()
          [[ -z "$PR" ]] || args+=(--pr "$PR")
          [[ -z "$HEAD" ]] || args+=(--head "$HEAD")
          [[ -z "$BASE" ]] || args+=(--base "$BASE")
          [[ -z "$MERGE" ]] || args+=(--merge-sha "$MERGE")
          [[ -z "$TAG" ]] || args+=(--tag "$TAG")
          python scripts/book_release.py release-plan "${args[@]}"

  build:
    needs: authorize
    if: github.ref == 'refs/heads/main' && needs.authorize.outputs.recovery != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      staging_id: ${{ steps.staging.outputs.artifact-id }}
      pdf_sha256: ${{ steps.integrity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          path: book
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml playwright
      - run: python -m playwright install chromium
        timeout-minutes: 10
      - name: Validate merge and bound editorial evidence
        env:
          BASE: ${{ needs.authorize.outputs.base }}
        run: |
          python trusted/site/validate_release.py --root book --base-ref "$BASE"
          python trusted/site/validate_evidence.py --root book --base-ref "$BASE"
      - name: Determine edition and require previous tag
        id: meta
        working-directory: book
        run: |
          python ../trusted/site/release_candidate.py --root . >> "$GITHUB_OUTPUT"
      - name: Build exact merge HTML and PDF
        working-directory: book
        run: |
          python site/generate.py
          python site/generate_pdf.py
          test -s site/index.html
          test -s site/apm-book.pdf
          head -c 5 site/apm-book.pdf | grep -Fx '%PDF-'
      - name: Prepare release artifact and notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir artifacts
          cp book/site/apm-book.pdf "artifacts/apm-book-$TAG.pdf"
          python trusted/site/extract_release_notes.py "${TAG#v}" --changelog book/content/CHANGELOG.md > artifacts/notes.md
          test -s artifacts/notes.md
      - name: Record expected PDF integrity
        id: integrity
        run: echo "sha256=$(sha256sum artifacts/*.pdf | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: staging
        with:
          name: release-book-${{ needs.authorize.outputs.sha }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [authorize, build]
    if: github.ref == 'refs/heads/main' && needs.authorize.outputs.recovery != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      actions: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-book-${{ needs.authorize.outputs.sha }}
          path: artifacts
      - name: Recheck authorization and publish draft after PDF upload
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head_sha }}
          BASE: ${{ inputs.base_sha }}
          MERGE: ${{ needs.authorize.outputs.sha }}
          TAG: ${{ needs.build.outputs.tag }}
          RECOVERY_TAG: ${{ inputs.tag }}
        run: |
          args=()
          [[ -z "$PR" ]] || args+=(--pr "$PR")
          [[ -z "$HEAD" ]] || args+=(--head "$HEAD")
          [[ -z "$BASE" ]] || args+=(--base "$BASE")
          [[ -z "$RECOVERY_TAG" ]] || args+=(--tag "$RECOVERY_TAG")
          python scripts/book_release.py release-plan --merge-sha "$MERGE" "${args[@]}"
          python scripts/book_release.py publish --tag "$TAG" --merge-sha "$MERGE" \
            --pdf "artifacts/apm-book-$TAG.pdf" --notes artifacts/notes.md

  deploy:
    needs: [authorize, build, publish]
    if: >-
      github.ref == 'refs/heads/main' && needs.authorize.outputs.recovery != 'true'
      && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Deploy the released tag and require its exact smoke-tested run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          MERGE: ${{ needs.authorize.outputs.sha }}
        run: python scripts/book_release.py deliver --tag "$TAG" --merge-sha "$MERGE"

  cleanup-staging:
    needs: [authorize, build, publish, deploy]
    if: >-
      github.ref == 'refs/heads/main'
      && needs.publish.outputs.published == 'true'
      && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify published PDF and finished consumers before deleting staging
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_ID: ${{ needs.build.outputs.staging_id }}
          PDF_SHA256: ${{ needs.build.outputs.pdf_sha256 }}
          TAG: ${{ needs.build.outputs.tag }}
          MERGE: ${{ needs.authorize.outputs.sha }}
        run: >-
          python scripts/artifact_storage.py release
          --run-id "$GITHUB_RUN_ID" --artifact-id "$STAGING_ID"
          --tag "$TAG" --merge-sha "$MERGE" --pdf-sha256 "$PDF_SHA256"
